# Hytale additions to role-guard.sh (see the header of .claude/hooks/role-guard.sh).
# team-lead may record the per-repository setup in .claude/local/hytale.toml.
path team-lead \.claude/local/
# Read-only inspection of the pinned server JAR and assets (unzip only lists, tests or prints to stdout).
readonly javap
readonly sha256sum
readonly unzip[[:space:]]+-[lpvZ]
