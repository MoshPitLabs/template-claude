# Arma Reforger rules for verify-gate.sh, tab-separated: changed-file regex, other changing tools, verifier, message.
\.c$	^mcp__enfusion-mcp__script_create$	mcp__enfusion-mcp__wb_validate_scripts	W1 gate: .c files changed after the last wb_validate_scripts run. Run mcp__enfusion-mcp__wb_validate_scripts (gproj_path, addons_dir and timeout_seconds from .claude/local/workbench.md) and quote the verdict. If it cannot run (Workbench missing, timeout), report W1 as unknown with the reason instead.
